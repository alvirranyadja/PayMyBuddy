services:
  paymybuddydb:
    image: mysql:8.0
    container_name: paymybuddydb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: db_paymybuddy
    volumes:
      - paymybuddy_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  paymybuddy:
    image: ${IMAGE_NAME}
    container_name: paymybuddy
    restart: unless-stopped
    depends_on:
      paymybuddydb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://paymybuddydb:3306/db_paymybuddy
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}

volumes:
  paymybuddy_db_data:
